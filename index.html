<div id="app-root"></div>

<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2e3a;
    --text: #e6e8ef;
    --muted: #8b8fa3;
    --accent: #7c9eff;
    --accent-dark: #5577dd;
    --code-bg: #0b0d13;
    --success: #5fd68a;
    --error: #ff7b7b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .wrap {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  textarea {
    width: 100%;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px;
    resize: vertical;
    min-height: 80px;
  }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  select, input[type="text"], input[type="password"] {
    background: var(--code-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
  }
  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 4px;
  }
  .settings-grid > div { display: flex; flex-direction: column; gap: 4px; }
  .settings-grid input, .settings-grid select { width: 100%; }
  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.5;
  }
  button {
    background: var(--accent);
    color: #0b0d13;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); color: white; }
  button:disabled { background: #3a3e4a; color: var(--muted); cursor: not-allowed; }
  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: #d7dce8;
    user-select: text;
    max-height: 420px;
    overflow-y: auto;
  }
  .lock-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .history-item {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 10px;
  }
  .history-item .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .history-item .prompt-text { font-size: 13px; margin-bottom: 6px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
  .err { color: var(--error); font-size: 13px; margin-top: 8px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; }
  .toolbar h2 { font-size: 15px; margin: 0; }
  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .clear-btn:hover { background: var(--border); color: var(--text); }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #0b0d13; border-top-color: transparent;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin-right: 6px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const PROVIDER_DEFAULTS = {
  anthropic: { label: "Anthropic (built-in, no key needed)", model: "claude-sonnet-4-6", endpoint: null },
  openrouter: { label: "OpenRouter", model: "openrouter/free", endpoint: "https://openrouter.ai/api/v1/chat/completions" },
  nvidia: { label: "NVIDIA NIM", model: "meta/llama-3.1-8b-instruct", endpoint: "https://integrate.api.nvidia.com/v1/chat/completions" }
};

function App() {
  const [prompt, setPrompt] = useState("");
  const [language, setLanguage] = useState("java");
  const [loading, setLoading] = useState(false);
  const [output, setOutput] = useState("");
  const [error, setError] = useState("");
  const [history, setHistory] = useState([]);
  const [historyLoaded, setHistoryLoaded] = useState(false);
  const [provider, setProvider] = useState("anthropic");
  const [apiKey, setApiKey] = useState("");
  const [model, setModel] = useState(PROVIDER_DEFAULTS.anthropic.model);

  const handleProviderChange = (p) => {
    setProvider(p);
    setModel(PROVIDER_DEFAULTS[p].model);
    setError("");
  };

  const loadHistory = useCallback(async () => {
    try {
      const listRes = await window.storage.list("entry:", false);
      if (!listRes || !listRes.keys || listRes.keys.length === 0) {
        setHistory([]);
        setHistoryLoaded(true);
        return;
      }
      const items = [];
      for (const key of listRes.keys) {
        try {
          const r = await window.storage.get(key, false);
          if (r && r.value) items.push(JSON.parse(r.value));
        } catch (e) { /* skip missing */ }
      }
      items.sort((a, b) => b.ts - a.ts);
      setHistory(items);
    } catch (e) {
      setHistory([]);
    }
    setHistoryLoaded(true);
  }, []);

  useEffect(() => { loadHistory(); }, [loadHistory]);

  const buildInstruction = () =>
    `You are helping a student practice prompt engineering for an AI-assisted coding interview. Respond ONLY with code (no explanation, no markdown fences) in ${language}, based on this request:\n\n${prompt}`;

  const stripFences = (text) =>
    (text || "").replace(/```[a-zA-Z]*\n?/g, "").replace(/```/g, "").trim();

  const callAnthropic = async () => {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: buildInstruction() }]
      })
    });
    if (!response.ok) throw new Error(`Anthropic API error: ${response.status}`);
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
    return stripFences(textBlocks);
  };

  const callOpenAICompatible = async (endpoint) => {
    if (!apiKey.trim()) throw new Error("__NEED_KEY__");
    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey.trim()}`
      },
      body: JSON.stringify({
        model: model,
        messages: [{ role: "user", content: buildInstruction() }],
        max_tokens: 1000
      })
    });
    if (!response.ok) {
      const bodyText = await response.text().catch(() => "");
      throw new Error(`${endpoint.includes("openrouter") ? "OpenRouter" : "NVIDIA NIM"} error: ${response.status} ${bodyText.slice(0, 200)}`);
    }
    const data = await response.json();
    const content = data?.choices?.[0]?.message?.content || "";
    return stripFences(content);
  };

  const handleGenerate = async () => {
    if (!prompt.trim()) return;
    setLoading(true);
    setError("");
    setOutput("");
    try {
      let cleaned;
      if (provider === "anthropic") {
        cleaned = await callAnthropic();
      } else {
        cleaned = await callOpenAICompatible(PROVIDER_DEFAULTS[provider].endpoint);
      }
      setOutput(cleaned || "(No code returned)");

      const entry = { id: Date.now().toString(), ts: Date.now(), prompt, language, provider, response: cleaned };
      try {
        await window.storage.set(`entry:${entry.id}`, JSON.stringify(entry), false);
      } catch (e) { /* storage failure shouldn't block UI */ }
      setHistory(prev => [entry, ...prev]);
    } catch (e) {
      if (e.message === "__NEED_KEY__") {
        setError("Enter an API key for this provider first.");
      } else if (e.message && e.message.includes("Failed to fetch")) {
        setError("Network/CORS error — this provider may be blocking requests from this sandboxed environment. Try OpenRouter, or run this file outside claude.ai.");
      } else {
        setError(e.message || "Something went wrong generating code. Try again.");
      }
    }
    setLoading(false);
  };

  const clearHistory = async () => {
    for (const item of history) {
      try { await window.storage.delete(`entry:${item.id}`, false); } catch (e) {}
    }
    setHistory([]);
  };

  return (
    <div className="wrap">
      <h1>Prompt → Code Trainer</h1>
      <div className="sub">Write a prompt, get generated code. The output is read-only — you can't hand-edit it, only re-prompt.</div>

      <div className="card">
        <label>Model provider</label>
        <div className="settings-grid">
          <div>
            <label style={{marginBottom: 0}}>Provider</label>
            <select value={provider} onChange={e => handleProviderChange(e.target.value)}>
              <option value="anthropic">Anthropic (default)</option>
              <option value="openrouter">OpenRouter</option>
              <option value="nvidia">NVIDIA NIM</option>
            </select>
          </div>
          <div>
            <label style={{marginBottom: 0}}>Model name</label>
            <input type="text" value={model} onChange={e => setModel(e.target.value)} />
          </div>
        </div>
        {provider !== "anthropic" && (
          <div style={{marginTop: "8px"}}>
            <label style={{marginBottom: 4}}>API key ({PROVIDER_DEFAULTS[provider].label})</label>
            <input
              type="password"
              value={apiKey}
              onChange={e => setApiKey(e.target.value)}
              placeholder="Paste your API key — not saved, session only"
              style={{width: "100%"}}
            />
          </div>
        )}
        <div className="note">
          {provider === "anthropic"
            ? "Uses Claude automatically — no key needed."
            : "Your key stays in this browser tab only. It's never saved to history or sent anywhere except " + (provider === "openrouter" ? "openrouter.ai" : "integrate.api.nvidia.com") + "."}
        </div>
      </div>

      <div className="card">
        <label>Your prompt</label>
        <textarea
          value={prompt}
          onChange={e => setPrompt(e.target.value)}
          placeholder="e.g. Write a function that merges two sorted arrays without using extra space..."
        />
        <div className="row">
          <select value={language} onChange={e => setLanguage(e.target.value)}>
            <option value="java">Java</option>
            <option value="kotlin">Kotlin</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="go">Go</option>
            <option value="cpp">C++</option>
          </select>
          <button onClick={handleGenerate} disabled={loading || !prompt.trim()}>
            {loading ? (<><span className="spinner"></span>Generating...</>) : "Generate code"}
          </button>
        </div>
        {error && <div className="err">{error}</div>}
      </div>

      {output && (
        <div className="card">
          <label>Generated code (read-only)</label>
          <div className="code-block">{output}</div>
          <div className="lock-note">🔒 This snippet can't be edited — refine your prompt above to change the result.</div>
        </div>
      )}

      <div className="card">
        <div className="toolbar">
          <h2>Prompt history ({history.length})</h2>
          {history.length > 0 && (
            <button className="clear-btn" onClick={clearHistory}>Clear all</button>
          )}
        </div>
        {!historyLoaded && <div className="empty">Loading history...</div>}
        {historyLoaded && history.length === 0 && (
          <div className="empty">No prompts yet — your attempts will be saved here.</div>
        )}
        {history.map(item => (
          <div className="history-item" key={item.id}>
            <div className="meta">{new Date(item.ts).toLocaleString()} · {item.language} · {item.provider || "anthropic"}</div>
            <div className="prompt-text"><strong>Prompt:</strong> {item.prompt}</div>
            <div className="code-block" style={{maxHeight: "160px"}}>{item.response}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app-root")).render(<App />);
</script>
